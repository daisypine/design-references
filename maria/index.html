<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JDH Landscaping — Business Launch Checklist</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: #e9e2d6;
      font-family: 'Georgia', 'Times New Roman', serif;
    }
    #app {
      min-height: 100vh;
      background: #f5f0e8;
      padding: 0 0 60px;
      max-width: 520px;
      margin: 0 auto;
      box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }
    .header {
      background: #1a2e1a;
      padding: 36px 28px 28px;
      position: relative;
      overflow: hidden;
    }
    .header .texture {
      position: absolute; inset: 0;
      background-image: repeating-linear-gradient(120deg,
        rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 1px,
        transparent 1px, transparent 14px);
      pointer-events: none;
    }
    .eyebrow {
      font-size: 11px; letter-spacing: 4px; color: #7cad7c;
      text-transform: uppercase; position: relative;
    }
    .header h1 {
      margin: 0; color: #e8f0e8; font-size: 32px; font-weight: normal;
      letter-spacing: 1px; line-height: 1.1; position: relative;
    }
    .subtitle {
      color: #7cad7c; font-size: 14px; margin-top: 6px; position: relative;
    }
    .progress-wrap { margin-top: 22px; position: relative; }
    .progress-labels {
      display: flex; justify-content: space-between;
      color: #aac9aa; font-size: 12px; margin-bottom: 7px;
    }
    .progress-track {
      background: rgba(255,255,255,0.1); border-radius: 4px;
      height: 6px; overflow: hidden;
    }
    .progress-fill {
      height: 100%; border-radius: 4px;
      background: linear-gradient(90deg, #4a7c4e, #7cad7c);
      transition: width 0.4s ease;
    }
    .banner {
      margin: 20px 16px 0;
      background: linear-gradient(135deg, #1a2e1a, #4a7c4e);
      color: #e8f0e8; border-radius: 12px; padding: 18px 20px;
      text-align: center; font-size: 15px; letter-spacing: 0.5px;
      box-shadow: 0 4px 14px rgba(74,124,78,0.3);
      animation: pop 0.4s ease;
    }
    @keyframes pop {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .cats { padding: 20px 16px 0; }
    .card {
      background: #fff; border-radius: 12px; margin-bottom: 16px;
      overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.07);
    }
    .card-head {
      padding: 14px 18px; display: flex; align-items: center; gap: 10px;
    }
    .card-icon { font-size: 20px; }
    .card-title { font-weight: bold; color: #1a1a1a; font-size: 15px; }
    .card-count { font-size: 11px; color: #888; margin-top: 1px; }
    .badge {
      font-size: 11px; font-weight: bold; padding: 2px 8px;
      border-radius: 20px; letter-spacing: 1px;
    }
    .task {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 11px 18px; cursor: pointer; transition: background 0.15s;
      border-bottom: 1px solid #f0f0f0; user-select: none;
    }
    .task:hover { background: #f9f9f9; }
    .checkbox {
      width: 20px; height: 20px; border-radius: 5px; flex-shrink: 0;
      margin-top: 1px; display: flex; align-items: center;
      justify-content: center; transition: all 0.2s;
    }
    .task-text {
      font-size: 14px; line-height: 1.45; transition: all 0.2s;
    }
    .footer {
      text-align: center; color: #aaa; font-size: 12px;
      margin-top: 8px; letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const categories = [
      {
        id: "design-build", label: "Design Build", icon: "✦", color: "#4a7c4e",
        tasks: [
          { id: 1, text: "Schedule in-person inspection with client" },
          { id: 2, text: "Conduct on-site walkthrough & measurements" },
          { id: 3, text: "Prepare visual demonstration / mood board" },
          { id: 4, text: "Present design concept to client" },
          { id: 5, text: "Finalize design build plan & timeline" },
        ],
      },
      {
        id: "website", label: "Website & Domain", icon: "◈", color: "#2e6fa3",
        tasks: [
          { id: 6, text: "Purchase domain for JDH Landscaping" },
          { id: 7, text: "Set up website hosting" },
          { id: 8, text: "Build & launch JDH Landscaping website" },
          { id: 9, text: "Add services, photos & contact info" },
        ],
      },
      {
        id: "google", label: "Google Business Profile", icon: "◉", color: "#c1440e",
        tasks: [
          { id: 10, text: "Create Google Business Profile (@.Daisy)" },
          { id: 11, text: "Add business hours, phone & address" },
          { id: 12, text: "Upload photos of past landscaping work" },
          { id: 13, text: "Request initial customer reviews" },
        ],
      },
      {
        id: "social", label: "Social Media — Elizabeth", icon: "❉", color: "#7b4fa6",
        tasks: [
          { id: 14, text: "Set up Instagram for JDH Landscaping" },
          { id: 15, text: "Set up Facebook business page" },
          { id: 16, text: "Create content calendar with Elizabeth" },
          { id: 17, text: "Post first batch of before/after photos" },
          { id: 18, text: "Link social accounts to website" },
        ],
      },
    ];

    const STORAGE_KEY = "jdh-landscaping-checklist";

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) return JSON.parse(saved);
      } catch (e) {}
      const all = {};
      categories.forEach((c) => c.tasks.forEach((t) => (all[t.id] = false)));
      return all;
    }

    function App() {
      const [tasks, setTasks] = useState(loadState);

      useEffect(() => {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); } catch (e) {}
      }, [tasks]);

      const toggle = (id) => setTasks((p) => ({ ...p, [id]: !p[id] }));

      const totalDone = Object.values(tasks).filter(Boolean).length;
      const total = Object.values(tasks).length;
      const pct = Math.round((totalDone / total) * 100);
      const allComplete = totalDone === total;

      return (
        <div>
          <div className="header">
            <div className="texture"></div>
            <div className="eyebrow">Action Plan</div>
            <h1>JDH Landscaping</h1>
            <div className="subtitle">Business Launch Checklist</div>
            <div className="progress-wrap">
              <div className="progress-labels">
                <span>{totalDone} of {total} tasks complete</span>
                <span>{pct}%</span>
              </div>
              <div className="progress-track">
                <div className="progress-fill" style={{ width: pct + "%" }}></div>
              </div>
            </div>
          </div>

          {allComplete && (
            <div className="banner">🌿 All set — JDH Landscaping is ready to launch!</div>
          )}

          <div className="cats">
            {categories.map((cat) => {
              const catDone = cat.tasks.filter((t) => tasks[t.id]).length;
              const catTotal = cat.tasks.length;
              const catComplete = catDone === catTotal;
              return (
                <div className="card" key={cat.id} style={{ border: "1px solid " + cat.color + "22" }}>
                  <div className="card-head" style={{
                    background: cat.color + "14",
                    borderLeft: "4px solid " + cat.color,
                  }}>
                    <span className="card-icon" style={{ color: cat.color }}>{cat.icon}</span>
                    <div style={{ flex: 1 }}>
                      <div className="card-title">{cat.label}</div>
                      <div className="card-count">{catDone}/{catTotal} done</div>
                    </div>
                    {catComplete && (
                      <span className="badge" style={{
                        color: cat.color, background: cat.color + "18",
                      }}>✓ COMPLETE</span>
                    )}
                  </div>
                  <div style={{ padding: "4px 0 8px" }}>
                    {cat.tasks.map((task) => {
                      const done = tasks[task.id];
                      return (
                        <div className="task" key={task.id} onClick={() => toggle(task.id)}>
                          <div className="checkbox" style={{
                            border: done ? "2px solid " + cat.color : "2px solid #ccc",
                            background: done ? cat.color : "transparent",
                          }}>
                            {done && (
                              <svg width="11" height="9" viewBox="0 0 11 9" fill="none">
                                <path d="M1 4L4 7L10 1" stroke="white" strokeWidth="2"
                                  strokeLinecap="round" strokeLinejoin="round" />
                              </svg>
                            )}
                          </div>
                          <span className="task-text" style={{
                            color: done ? "#aaa" : "#222",
                            textDecoration: done ? "line-through" : "none",
                          }}>{task.text}</span>
                        </div>
                      );
                    })}
                  </div>
                </div>
              );
            })}
          </div>

          <div className="footer">TAP ANY TASK TO MARK COMPLETE</div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("app")).render(<App />);
  </script>
</body>
</html>
